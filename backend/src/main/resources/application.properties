# ================================
# APPLICATION CONFIGURATION
# ================================
spring.application.name=ai-resume-generator
server.port=8080

# ================================
# MYSQL DATABASE CONFIGURATION
# ================================
spring.datasource.url=jdbc:mysql://localhost:3306/resume_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ================================
# JWT CONFIGURATION
# ================================
app.jwt.secret=airesumeGeneratorSuperSecretKey2024XYZ@#$SpringBootJWT
app.jwt.expiration=86400000

# ================================
# OLLAMA / AI CONFIGURATION
# ================================
ollama.base-url=http://localhost:11434
ollama.model=deepseek-r1:1.5b

# ================================
# CORS CONFIGURATION
# ================================
app.cors.allowed-origins=http://localhost:3000

# ================================
# LOGGING
# ================================
logging.level.com.resumeai=INFO
logging.level.org.springframework.security=WARN
